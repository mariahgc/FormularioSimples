<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro Simples</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap');

    body {
        background-color: #172b22;
        margin: 0;
    }

    .container {
        width: 100%;
        display: grid;
        grid-template-columns: 500px 500px;
        gap: 600px;
    }

    .formulario-container {
        background-color: #1d1d1d;
        margin-top: 25%;
        padding: 50px 50px 50px 50px;
        width: 100%;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;

    }

    input::placeholder {
        color: #ececec8f;
        font-family: "Poppins", sans-serif;
        font-weight: 200;
        font-style: normal;
    }


    .bloco1 p {
        margin-left: 60%;
        color: #ececec;
        width: 600px;
        margin-top: 70px;
        font-family: "Poppins", sans-serif;
        font-weight: 500;
        font-style: normal;
    }

    .linha {
        width: 100px;
        background-color: #fff;
        height: 2px;
        margin-left: 60%;
    }

    h1 {
        font-size: 7rem;
        margin-left: 60%;
        color: #fffdf2;
        margin-top: 45%;
    }

    h2 {
        text-align: center;
        font-size: 3rem;
        color: #fffdf2;
        font-family: "Poppins", sans-serif;
        font-weight: 800;
        font-style: normal;
    }

    label {
        display: block;
        margin-top: 10px;
        color: #e9ecef;
        font-family: "Poppins", sans-serif;
        font-weight: 500;
        font-style: normal;
        margin-top: 15px;
    }

    input .texto {
        background-color: transparent;
    }

    input {
        padding: 8px;
        margin-top: 5px;
        border-radius: 50px;
        border: none;
        backdrop-filter: blur(10px);
        background-color: transparent;
        background: rgba(255, 255, 255, 0.15);
        height: 25px;
        color: #e9ecef;
        font-family: "Poppins", sans-serif;
        font-weight: 500;
        width: 480px;
        font-style: normal;
        padding-left: 15px;
    }

    button {
        margin-top: 50px;
        width: 100%;
        padding: 10px;
        color: #172b22;
        background-color: #fffdf2;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-size: 1.4rem;
        font-weight: 600;
        transition: 1s ease;
    }

    button:hover {
        background-color: #172b22;
        color: #f9dada;
        transition: 1s ease;
    }

    #resultado {
        top: 20px;
        padding: 10px;
        border-radius: 5px;
        color: #ffffff;
        font-family: "Poppins", sans-serif;
        font-weight: 500;
        font-style: normal;
    }
</style>
</head>

<body>

    <div class="container">
        <div class="bloco1">
            <h1 class="titulo">Welcome!</h1>
            <div class="linha"></div>
            <p class="descricao">Lorem ipsum dolor sit amet consectetur adipisicing elit. Numquam nulla ab corrupti nam
                molestiae magnam voluptas accusamus molestias quam sed? Ab autem mollitia enim quo voluptate aliquam
                quam corrupti aut.</p>
        </div>
        <div class="bloco2">
            <div class="formulario-container">
                <h2>Cadastro</h2>

                <form id="formCadastro">
                    <label for="nome">Nome:</label>
                    <input class="texto" type="text" id="nome" name="nome" required minlength="3"
                        placeholder="Digite seu nome">

                    <label for="email">E-mail:</label>
                    <input class="texto" type="email" id="email" name="email" required placeholder="exemplo@email.com">

                    <label for="idade">Idade:</label>
                    <input class="texto" type="number" id="idade" name="idade" required min="0" max="120"
                        placeholder="Digite sua idade">

                    <button type="submit">Cadastrar</button>
                    <div id="resultado"></div>

                </form>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("formCadastro");
        const resultado = document.getElementById("resultado");

        form.addEventListener("submit", function (event) {
            event.preventDefault();


            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const idade = document.getElementById("idade").value;


            resultado.innerHTML = `
            <h3>Dados Cadastrados:</h3>
            <p><strong>Nome:</strong> ${nome}</p>
            <p><strong>E-mail:</strong> ${email}</p>
            <p><strong>Idade:</strong> ${idade}</p>
        `;
        });
    </script>
</body>

</html>
